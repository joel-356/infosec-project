{% extends "base.html" %}
{% block content %}

<h2>Inbox</h2>

{% if messages %}
    {% for m in messages %}
    <div class="card">
        <strong>From:</strong> {{ m.sender }}<br>
        <strong>Subject:</strong> {{ m.subject }}<br>
        <p>{{ m.message }}</p>
    </div>
    {% endfor %}
{% else %}
<p>No messages.</p>
{% endif %}

{% endblock %}
